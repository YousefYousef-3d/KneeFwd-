  missingness_scenarios: config/missingness_scenarios.yaml
run_plotting: true
run_imputation: true
figure_settings:
  dpi: 150
  max_patients_per_class_plot: 3
  rolling_window_days: 7
validation:
  expected_missingness_rate_min: 0.05
  expected_missingness_rate_max: 0.35
  class_proportion_tolerance: 0.08
  early_recovery_day: 21
  week12_day: 84
